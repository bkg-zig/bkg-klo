<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<title>BKG Office — nativ im Web (kein Electron)</title>
<style>
*{border-radius:0!important;box-sizing:border-box}
body{margin:0;background:#0F1D32;color:#FFFDF7;font-family:"JetBrains Mono",monospace}
.bar{border:3px solid #000;box-shadow:6px 6px 0 #000;background:#FFFDF7;color:#0F1D32;padding:10px;margin:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;border:3px solid #000;box-shadow:4px 4px 0 #000;background:#FFFDF7;cursor:pointer;padding:6px 10px}
canvas{border:3px solid #000;box-shadow:6px 6px 0 #000;margin:12px;image-rendering:pixelated;background:#1a2f4a}
#log{margin:12px;border:3px solid #000;background:#081426;padding:10px;min-height:60px;white-space:pre-wrap}
</style></head><body>
<div class="bar"><b>BKG OFFICE</b>
<select id="cli"><option>opencode</option><option>claude-code</option><option>codex</option><option>grok</option><option>kimi</option><option>qwen</option><option>copilot</option><option>cursor</option><option>antigravity</option><option>crush</option><option>pi</option></select>
<input id="nm" value="OpenCode" style="font:inherit;border:3px solid #000;padding:6px">
<button id="hire">Hire Employee</button><button id="run">Run Floor</button><span id="st">bereit</span></div>
<canvas id="cv" width="640" height="448"></canvas><div id="log"></div>
<script type="module">
import { initializeBuiltinWebMCP } from 'https://esm.run/@opentiny/next-sdk';
try { initializeBuiltinWebMCP(); } catch(e) { log('WebMCP Fallback aktiv: '+e.message); }
const TILE=32, state={desks:[],emps:[],anims:[]};
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
function log(m){document.getElementById('log').textContent+=m+'\n';}
async function tool(name,args){
  log(name+' '+JSON.stringify(args));
  try{ const r=await fetch('/api/office/tools/'+name,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({args})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||r.status); await refresh(); return j.data;
  }catch(e){ log('lokal (kein Gateway): '+e.message); return null; }
}
function reg(name,fn){ if(document.modelContext) document.modelContext.registerTool({name,description:name,inputSchema:{type:'object',properties:{}},execute:async(a)=>{await fn(a);return{content:[{type:'text',text:name+' ok'}]};}}); }
reg('place_desk',a=>tool('place_desk',a)); reg('place_chair',a=>tool('place_chair',a));
reg('place_agent',a=>tool('place_agent',a)); reg('move_agent',a=>tool('move_agent',a));
reg('send_envelope',a=>tool('send_envelope',a)); reg('assign_task',a=>tool('assign_task',a));
reg('set_agent_status',a=>tool('set_agent_status',a)); reg('spawn_agent',a=>tool('spawn_agent',a));
reg('approve',a=>tool('approve',a));
async function refresh(){ try{ const r=await fetch('/api/office'); const j=await r.json(); if(j.ok){state.desks=j.data.desks||[];state.emps=j.data.employees||[];} }catch(e){} draw(); }
/* Pixel sprites in the MUNDER-DIFFLIN reference style (navy outline, cyan
   rim, neon code bars). Generated by scripts/gen_pixel_sprites.py into
   assets/sprites/ (names = assets/manifest.json). If a PNG is missing the
   canvas fallback below keeps the floor usable — same contract as before. */
const SPR={};
for(const n of ['floor_tile_00.png','floor_tile_01.png','desk_dual_monitor_01.png','desk_snes_01.png','server_rack_snes_01.png','cabinet_01.png','plant_snes_01.png','desk_wood_01.png','agent_typing_02.png','agent_walking_right_01.png','agent_celebrating_01.png','status_green.png','status_amber.png','status_blue.png','status_red.png']){
  const im=new Image(); im.src='assets/sprites/'+n; SPR[n]=im; }
const sprOk=n=>SPR[n]&&SPR[n].complete&&SPR[n].naturalWidth>0;
const STATUS_SPR={GreenActive:'status_green.png',AmberAttention:'status_amber.png',BlueReady:'status_blue.png',RedError:'status_red.png'};
const GLOW={GreenActive:'#39ff6a',AmberAttention:'#ffb000',BlueReady:'#3fa9ff',RedError:'#ff4d4d'};
function drawSprite(n,cx,bottomY,w){ const im=SPR[n]; ctx.drawImage(im,cx-w/2,bottomY-im.height*(w/im.width),w,im.height*(w/im.width)); }
function draw(){ ctx.clearRect(0,0,640,448);
  for(let y=0;y<14;y++)for(let x=0;x<20;x++){ const n=(x+y)%2?'floor_tile_01.png':'floor_tile_00.png';
    if(sprOk(n)) ctx.drawImage(SPR[n],x*TILE,y*TILE); else { ctx.fillStyle=(x+y)%2?'#24405f':'#1d3552'; ctx.fillRect(x*TILE,y*TILE,TILE,TILE); } }
  ctx.strokeStyle='#000'; ctx.strokeRect(1,1,638,446);
  for(const d of state.desks){ const occ=state.emps.find(e=>e.desk&&e.desk[0]===d.x&&e.desk[1]===d.y);
    const glow=occ?(GLOW[occ.status]||'#35c4ff'):'#1d4e79', cx=d.x*TILE+16, by=(d.y+1)*TILE;
    ctx.save(); ctx.globalAlpha=.5; ctx.fillStyle=glow; ctx.fillRect(d.x*TILE+1,d.y*TILE+16,62,26); ctx.restore();
    if(sprOk(d.asset)){ const im=SPR[d.asset], sc=Math.min(64/im.width,64/im.height); ctx.drawImage(im,cx-im.width*sc/2,by-im.height*sc,im.width*sc,im.height*sc); }
    else { ctx.fillStyle='#c9a86a'; ctx.fillRect(d.x*TILE+3,d.y*TILE+10,26,18); ctx.fillStyle='#57d7ff'; ctx.fillRect(d.x*TILE+7,d.y*TILE+4,18,10); } }
  for(const e of state.emps){ const p=e._p||(e._p=e.desk?[e.desk[0]*TILE+16,e.desk[1]*TILE+28]:[32,32]);
    if(e.desk){ const tx=e.desk[0]*TILE+16, ty=e.desk[1]*TILE+28; p[0]+=(tx-p[0])*0.08; p[1]+=(ty-p[1])*0.08; }
    const sn=STATUS_SPR[e.status];
    if(e.sprite&&sprOk(e.sprite)) drawSprite(e.sprite,p[0],p[1]+6,30);
    else if(sprOk('agent_typing_02.png')) drawSprite('agent_typing_02.png',p[0],p[1]+6,30);
    else { ctx.fillStyle=GLOW[e.status]||'#5aa0ff'; ctx.fillRect(p[0]-6,p[1]-14,12,14); }
    if(sn&&sprOk(sn)) ctx.drawImage(SPR[sn],p[0]-16,p[1]-26,10,10);
    ctx.fillStyle='#FFFDF7'; ctx.font='9px monospace'; ctx.fillText(e.name,p[0]-14,p[1]+10); }
  requestAnimationFrame(draw); }
document.getElementById('hire').onclick=async()=>{ const cli=document.getElementById('cli').value, name=document.getElementById('nm').value;
  await tool('spawn_agent',{cli,name,desk:'desk_snes_01.png',approved:true}); document.getElementById('st').textContent=name+' laeuft zum Desk (Lerp)'; };
document.getElementById('run').onclick=async()=>{ await tool('send_envelope',{from:'emp_1',to:'desk',text:'tankstelle'}); };
refresh();
</script></body></html>
